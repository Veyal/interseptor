<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interseptor — Sign in</title>
<!-- The sign-in screen used to carry its own private palette (#0e1116 surfaces, a
     BLUE #3b82f6 accent) and its own type sizes, so the first screen an operator
     saw looked like a different product from the one behind it, and it had no
     light theme at all. It now loads the same stylesheet and the same tokens as
     the app; only page-specific layout lives below. -->
<link rel="stylesheet" href="/app.css">
<script>
// Apply the saved (or system) theme before first paint to avoid a flash — same
// contract as index.html, so sign-in and the app agree on the theme.
(function(){try{
  var t=localStorage.getItem('theme');
  if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  if(t==='light')document.documentElement.setAttribute('data-theme','light');
}catch(e){}})();
</script>
<style>
  /* Override the app shell's fixed desktop chrome: sign-in is a single centred
     card and must stay usable at phone widths. */
  body{ min-width:0; overflow:auto; align-items:center; justify-content:center; padding:24px; }
  .card{ width:min(100%,380px); background:var(--bg2); border:1px solid var(--line2);
         border-radius:var(--r-xl); padding:28px; box-shadow:var(--elev-3); }
  .card h1{ margin:0 0 4px; font-size:var(--fs-2xl); font-weight:700; letter-spacing:.3px; }
  .card .sub{ margin:0 0 20px; color:var(--fg3); font-size:var(--fs-md); }
  .card label{ display:block; font-size:var(--fs-sm); color:var(--fg3); margin-bottom:6px; }
  .card input{ width:100%; padding:11px 12px; background:var(--bg3); border:1px solid var(--line2);
               border-radius:var(--r-md); color:var(--fg); font-family:var(--mono); font-size:var(--fs-md); }
  .card input:focus{ border-color:var(--accent); }
  .card button{ width:100%; margin-top:16px; padding:11px; background:var(--accentSolid);
                color:var(--onAccent); border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);
                border-radius:var(--r-md); font-family:var(--ui); font-size:var(--fs-md); font-weight:600; cursor:pointer; }
  .card button:hover:not(:disabled){ filter:brightness(1.12); }
  .card input:focus-visible,.card button:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
  .card button:disabled{ opacity:.6; cursor:default; }
  .err{ margin-top:14px; color:var(--red); font-size:var(--fs-md); min-height:18px; }
  .foot{ margin-top:18px; color:var(--fg3); font-size:var(--fs-sm); line-height:1.5; }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>Interseptor</h1>
    <p class="sub">Enter your access key to view this session.</p>
    <label for="tok">Access key</label>
    <input id="tok" type="password" autocomplete="off" placeholder="ick_…" autofocus>
    <button id="go" type="submit">Sign in</button>
    <div class="err" id="err" role="alert" aria-live="polite"></div>
    <div class="foot">Read-only keys can watch; full keys can act. Keys are issued by the operator.</div>
  </form>
<script>
  const f=document.getElementById('f'), tok=document.getElementById('tok'),
        err=document.getElementById('err'), go=document.getElementById('go');
  f.addEventListener('submit', async (e)=>{
    e.preventDefault(); err.textContent=''; go.disabled=true;
    try{
      const r=await fetch('/api/session/auth',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:tok.value.trim()})});
      if(r.ok){ location.href='/'; return; }
      const d=await r.json().catch(()=>({}));
      err.textContent=d.error||('Sign-in failed ('+r.status+')');
    }catch(ex){ err.textContent='Network error'; }
    go.disabled=false;
  });
</script>
</body>
</html>
