openapi: 3.1.0
info: {title: Cycles and refs, version: "1"}
webhooks:
  ping: {post: {responses: {"200": {description: ok}}}}
paths:
  /nodes:
    post:
      summary: Create node
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Node"}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "https://other.example.com/schema.json#/Node"}
  /loop:
    $ref: "#/paths/~1loop2"
  /loop2:
    $ref: "#/paths/~1loop"
  /ext:
    $ref: "other.yaml#/paths/~1x"
  /a-b:
    get:
      parameters:
        - $ref: "#/components/parameters/Missing"
      responses: {"200": {description: ok}}
components:
  schemas:
    Node:
      type: object
      properties:
        value: {type: [string, "null"]}
        next: {$ref: "#/components/schemas/Node"}
        kids:
          type: array
          items: {$ref: "#/components/schemas/Node"}
        a: {$ref: "#/components/schemas/A"}
    A: {$ref: "#/components/schemas/B"}
    B: {$ref: "#/components/schemas/A"}
