name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; a job that needs more declares it itself.
permissions:
  contents: read

# A new push to the same PR/branch supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gofmt_check.sh diffs against the base branch.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: gofmt (Go files changed on this branch)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            BASE="$(git merge-base HEAD "origin/$BASE_REF")" scripts/gofmt_check.sh
          else
            scripts/gofmt_check.sh
          fi
      - run: go vet ./...
      - name: UI audit manifest digest is current
        run: go run ./tools/auditdigest
      - run: go test ./...
      - run: CGO_ENABLED=1 go test -race ./...

  # Real-browser boot check for the vanilla-JS UI (no build step, no type
  # checker). ubuntu-latest ships google-chrome.
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: scripts/ui_smoke.sh

  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o interseptor ./cmd/interseptor

  # macOS-native job: covers the darwin-only source (internal/proc, internal/sysproxy)
  # that the cross-compiling matrix above can build but never runs, and verifies the
  # Interseptor.app bundle assembles. Unsigned — signing and notarization need a
  # Developer ID certificate and notary credentials in secrets, which CI does not have.
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep tags available so CI exercises the `git describe` path; shallow
          # or no-tag builds fall back to internal/version for bundle metadata.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test on macOS
        run: go test ./...
      - name: Build Interseptor.app
        run: make macos-app
      - name: Validate bundle
        run: |
          set -euo pipefail
          APP=dist/macos/Interseptor.app
          test -x "$APP/Contents/MacOS/interseptor"
          test -x "$APP/Contents/MacOS/interseptor-macapp"
          plutil -lint "$APP/Contents/Info.plist"
          for bin in "$APP/Contents/MacOS/"*; do
            lipo -info "$bin" | grep -q 'x86_64 arm64' || { echo "not universal: $bin"; exit 1; }
          done
          echo "bundle OK"
      # Zip before upload: upload-artifact does not preserve the executable bit, so
      # uploading the .app directly produces a bundle that cannot launch. ditto
      # keeps the bundle structure and permissions intact inside the archive.
      - name: Archive bundle
        run: ditto -c -k --keepParent dist/macos/Interseptor.app dist/macos/Interseptor-app-unsigned.zip
      - uses: actions/upload-artifact@v7
        with:
          name: interseptor-macos-app-unsigned
          path: dist/macos/Interseptor-app-unsigned.zip
          if-no-files-found: error
