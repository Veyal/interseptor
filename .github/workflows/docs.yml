name: Documentation
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  # Pages deploys must finish; only superseded PR validations are cancelled.
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Page.Updated comes from git log; a shallow clone has no history.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - run: go run ./tools/docscheck generate
      - run: git diff --exit-code -- llms.txt llms-full.txt docs/agents.md
      - run: go test ./tools/docscheck
      - run: go run ./tools/docscheck check
      - run: go run ./tools/docscheck build _site
      - run: go run ./tools/docscheck check-site _site
      - run: go test ./...
      - run: go vet ./...
  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Page.Updated comes from git log; a shallow clone has no history.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - run: go run ./tools/docscheck build _site
      - run: go run ./tools/docscheck check-site _site
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with: {path: _site}
      - id: deployment
        uses: actions/deploy-pages@v5
