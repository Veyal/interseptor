- number: "01"
  id: intercepting-proxy
  title: Intercepting proxy
  text: HTTP and HTTPS interception with on-demand local-CA leaf certificates, plus request and response hold, edit, forward, drop, and match-and-replace.
  link: /proxy-and-tls/
- number: "02"
  id: live-history
  title: Live history
  text: SQLite metadata and content-addressed bodies with searchable metadata, headers, tags, bounded body matching, and saved Starlark predicates.
  link: /history-search/
- number: "03"
  id: intercept-workflow
  title: Intercept workflow
  text: Hold, edit, forward, or drop requests and responses with ordered match-and-replace rules.
  link: /workspace/#intercept
- number: "04"
  id: repeater
  title: Repeater
  text: Editable request tabs with Raw, Pretty, optional Decoded, and sandboxed HTML Render response views, plus persistent per-tab send history.
  link: /workspace/#repeater-response-views
- number: "05"
  id: intruder
  title: Intruder
  text: Sniper, Pitchfork, and Race modes with thread and delay controls, payload processing, grep matching, extraction, anomalies, attack tabs, and run history.
  link: /workspace/#other-workspace-tools
- number: "06"
  id: authorization
  title: Authorization testing
  text: Replay requests as saved identities and diff responses for broken access control. OOB catcher supports blind callbacks when explicitly enabled.
  link: /workspace/#other-workspace-tools
- number: "07"
  id: agent-orchestration
  title: External agent orchestration
  text: MCP exposes deterministic capture, replay, mutation, scope, scanning, evidence, and finding tools. Actions remain recorded in History, Activity, and findings.
  link: /api-and-mcp/
- number: "08"
  id: mobile
  title: Mobile device support
  text: Android adb-based CA and proxy setup plus iOS profile and jailbroken-device SSH automation.
  link: /mobile-testing/
- number: "09"
  id: collaboration
  title: Collaboration and remote access
  text: Scoped and expiring API keys, key-authorized remote access, browser login, one-click Cloudflare tunnel, and project pull/push merge.
  link: /projects-and-data/#backup-and-collaboration
- number: "10"
  id: launcher
  title: Multi-project launcher
  text: The launcher dashboard starts, stops, and discovers multiple project instances.
  link: /getting-started/#running-multiple-projects
- number: "11"
  id: external-ai
  title: External AI integration
  text: External assistants connect through MCP or REST/SSE while Interseptor supplies deterministic tools and evidence. Model calls remain outside the binary.
  link: /api-and-mcp/
- number: "12"
  id: scanner
  title: Scanner
  text: Built-in passive checks cover security headers, CORS, reflected parameters, secrets, cookies, authentication, and version disclosure.
  link: /workspace/#scanner-and-map
- number: "13"
  id: playbooks
  title: Playbooks
  text: Markdown test guides ship in the binary and extend per project; the connected agent reads them over MCP and executes them, and a coverage ledger records what was tested.
  link: /playbooks/
- number: "14"
  id: checks
  title: Custom checks and rule packs
  text: Sandboxed Starlark passive checks extend scanner behavior without a fork, with official and community bundles.
  link: /custom-checks/
- number: "15"
  id: codecs
  title: Message codecs
  text: Project-scoped Starlark encrypt/decrypt helpers provide decoded views and opt-in re-encoding for application payloads.
  link: /message-codecs/
- number: "16"
  id: signed-packs
  title: Signed rule packs
  text: Ed25519 publisher signatures and manifest SHA-256 protect rule-pack provenance during install.
  link: /rule-packs/
- number: "17"
  id: discovery
  title: Guided content discovery
  text: Run feroxbuster, ffuf, or similar tools through the proxy from Map and cluster soft-404 responses.
  link: /content-discovery/
- number: "18"
  id: http2
  title: HTTP/2 upstream
  text: Prefer h2 to origins while keeping the MITM client leg on HTTP/1.1.
  link: /http2/
- number: "19"
  id: scope
  title: Target scope
  text: Include and exclude rules focus History, intercept gates, and scanner activity.
  link: /settings/#testing
- number: "20"
  id: websockets
  title: WebSocket
  text: Capture ws and wss traffic per frame and replay it in a WebSocket Repeater.
  link: /workspace/#websocket-frames
- number: "21"
  id: session-auth
  title: Session and auth injection
  text: Apply Authorization or Cookie headers, refresh tokens with a token macro, and re-authenticate with a recorded login macro.
  link: /settings/#testing
- number: "22"
  id: import-export
  title: Import and export
  text: HAR, Burp saved-items XML, Postman collections, portable project JSON, and full project archives for different sharing and backup needs.
  link: /projects-and-data/#export-formats
- number: "23"
  id: vault
  title: Project vault
  text: Always-on archive storage supports multi-device backup, import, and merge through Tailscale Serve.
  link: /vault/
- number: "24"
  id: model-free
  title: Model-free core
  text: No provider keys, built-in chat, or autonomous pentest loop. External models use deterministic tools with scope enforcement and evidence recording.
  link: /architecture/#security-model
- number: "25"
  id: findings
  title: Findings and reporting
  text: Searchable evidence review, multiple targets, CVSS v4, report readiness, immutable revisions and restore, and Final or Draft exports.
  link: /findings-and-reporting/
- number: "26"
  id: api-mcp
  title: API and MCP
  text: REST control API, SSE event stream, and full MCP server expose the same deterministic engine to scripts and agents.
  link: /api-and-mcp/
- number: "27"
  id: notes
  title: Notes
  text: Project Markdown notes with image paste, Edit and Preview, autosave, and recovery after a rejected save.
  link: /workspace/#notes
- number: "28"
  id: activity
  title: Activity
  text: Recorded agent actions with intent filters, result details, and links to related captured flows.
  link: /workspace/#activity
- number: "29"
  id: decoder
  title: Decoder
  text: Inspect Base64, URL, Hex, HTML, and JWT text with a separate input and copyable output.
  link: /workspace/#decoder
- number: "30"
  id: map
  title: Map
  text: Tree and graph views of captured hosts and endpoints, with search, filters, and collapsible groups.
  link: /workspace/#scanner-and-map
- number: "31"
  id: settings
  title: Settings
  text: Searchable Network, Testing, and System sections with clear save state and failure recovery.
  link: /settings/
- number: "32"
  id: session-inspector
  title: Session inspector
  text: Passive timelines and role comparisons for selected History captures, with redacted observations and no new requests.
  link: /workspace/#session-inspector
- number: "33"
  id: collections
  title: Collections
  text: Saved requests with environments, variables, auth, quarantined pm-compatible scripts, a runner, a CI command with JUnit output, and importers for Postman, OpenAPI, curl, Insomnia, Bruno, HAR, and Burp.
  link: /collections/
